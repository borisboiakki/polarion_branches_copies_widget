# Package a widget for deployment when a GitHub release is published.
# The release tag names the widget and the version: <widget>-vN.N.N (e.g. docCoverage-v0.1.0,
# docBranches-v0.2.1). Releases up to v0.2.0 used plain vN.N.N tags (docBranches only, old layout).
# The version is stamped into the widget, the tests run, and <widget>-N.N.N.zip is attached to the release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)package, e.g. docBranches-v0.2.1'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the widget and version number
        id: version
        run: |
          if [[ "$TAG" =~ ^([A-Za-z][A-Za-z0-9]*)-v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            widget="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
          else
            echo "::error::Release tag '$TAG' is not <widget>-vN.N.N (e.g. docBranches-v0.2.1)"
            exit 1
          fi
          echo "widget=$widget" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the widget exists and warn if its VERSION differs from the tag
        run: |
          f="widgets/${{ steps.version.outputs.widget }}/VERSION"
          if [ ! -f "$f" ]; then
            echo "::error::No widget '${{ steps.version.outputs.widget }}' in widgets/ at tag $TAG"
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < "$f")" != "${{ steps.version.outputs.version }}" ]; then
            echo "::warning::$f contains '$(cat "$f")' but the release is ${{ steps.version.outputs.version }}. The package uses the release version; update VERSION in the next change."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Velocity 1.4 jars
        uses: actions/cache@v4
        with:
          path: tools/.lib
          key: velocity-1.4-jars-v1

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Test the widget
        run: tools/test-widget.sh "${{ steps.version.outputs.widget }}" "$RUNNER_TEMP/widget-test"

      - name: Build the release package
        run: |
          w="${{ steps.version.outputs.widget }}"; v="${{ steps.version.outputs.version }}"
          python3 tools/build-widget.py --widget "$w" --version "$v"
          cp "widgets/$w/dist/$w.zip" "$w-$v.zip"
          unzip -l "$w-$v.zip"

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.version.outputs.widget }}-${{ steps.version.outputs.version }}.zip" --clobber
