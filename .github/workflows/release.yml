# Package the widget for deployment when a GitHub release is published.
# The release tag must be N.N.N or vN.N.N (e.g. v0.2.0). The version is stamped into the widget,
# the tests run, and docBranches-N.N.N.zip is attached to the release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)package, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the version number
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not N.N.N or vN.N.N"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Warn if VERSION differs from the tag
        run: |
          if [ "$(tr -d '[:space:]' < VERSION)" != "${{ steps.version.outputs.version }}" ]; then
            echo "::warning::VERSION file contains '$(cat VERSION)' but the release is ${{ steps.version.outputs.version }}. The package uses the release version; update VERSION in the next change."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Velocity 1.4 jars
        uses: actions/cache@v4
        with:
          path: tools/.lib
          key: velocity-1.4-jars-v1

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Test the widget
        run: tools/test-widget.sh "$RUNNER_TEMP/widget-test"

      - name: Build the release package
        run: |
          python3 tools/build-widget.py --version "${{ steps.version.outputs.version }}"
          cp widget/dist/docBranches.zip "docBranches-${{ steps.version.outputs.version }}.zip"
          unzip -l "docBranches-${{ steps.version.outputs.version }}.zip"

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "docBranches-${{ steps.version.outputs.version }}.zip" --clobber
